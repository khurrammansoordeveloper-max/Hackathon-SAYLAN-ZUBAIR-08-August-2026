<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth System - Firebase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <!-- Login Form -->
        <div class="form-box" id="loginForm">
            <h2>Sign In</h2>
            <form id="signInForm">
                <div class="input-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="Enter email">
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p class="toggle-text">Don't have an account? <span id="toSignUp">Sign Up</span></p>
        </div>

        <!-- Sign Up Form (Hidden by default) -->
        <div class="form-box hidden" id="signUpForm">
            <h2>Create Account</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" required placeholder="Choose email">
                </div>
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required placeholder="Choose password">
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <p class="toggle-text">Already have an account? <span id="toLogin">Sign In</span></p>
        </div>
    </div>

    <!-- Firebase SDK Implementation -->
    <script type="module" src="app.js"></script>
</body>
</html>
